# Cấu hình chung cho mọi môi trường. KHÔNG ghi bí mật vào đây (AGENTS.md quy tắc 6).
spring:
  application:
    name: xile-spa-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema chỉ đổi bằng Flyway, không bao giờ update/create.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never

xile:
  init:
    owner:
      email: ${APP_OWNER_EMAIL:}
      password: ${APP_OWNER_PASSWORD:}
      display-name: ${APP_OWNER_NAME:Chủ tiệm Xile}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-duration: ${JWT_ACCESS_DURATION:15m}
      refresh-token-duration: ${JWT_REFRESH_DURATION:7d}
      cookie-secure: ${JWT_COOKIE_SECURE:false}
    auth:
      max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${AUTH_LOCK_DURATION:15m}
      password-reset-duration: ${AUTH_PASSWORD_RESET_DURATION:30m}
      reset-password-base-url: ${AUTH_RESET_PASSWORD_BASE_URL:http://localhost:5173/reset-password}


