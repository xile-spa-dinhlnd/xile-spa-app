# Cấu hình chung cho mọi môi trường. KHÔNG ghi bí mật vào đây (AGENTS.md quy tắc 6).
spring:
  application:
    name: xile-spa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema chỉ đổi bằng Flyway, không bao giờ update/create.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never

xile:
  init:
    owner:
      email: ${APP_OWNER_EMAIL:}
      password: ${APP_OWNER_PASSWORD:}
      display-name: ${APP_OWNER_NAME:Chủ tiệm Xile}
  # Dữ liệu mẫu cho máy dev (backend/AGENTS.md mục "Dữ liệu mẫu cho máy dev"); chỉ bật ở application-dev.yml.
  dev-data:
    enabled: false
  mail:
    sender: log # log | smtp
    from: ${MAIL_FROM:no-reply@xilespa.vn}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-duration: ${JWT_ACCESS_DURATION:15m}
      refresh-token-duration: ${JWT_REFRESH_DURATION:7d}
      cookie-secure: ${JWT_COOKIE_SECURE:false}
    auth:
      max-failed-attempts: 5
      lock-duration: 15m
      password-reset-duration: 30m
      reset-password-base-url: ${AUTH_RESET_PASSWORD_BASE_URL:http://localhost:5173/reset-password}


