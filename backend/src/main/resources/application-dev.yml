# Máy dev: Postgres chạy bằng docker-compose.yml ở thư mục gốc, cổng 5433 (card S0-05). Giá trị mặc định chỉ dùng cho DB dev, ghi đè bằng biến môi trường.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/xile_spa}
    username: ${DB_USERNAME:xile}
    password: ${DB_PASSWORD:xile_dev}

logging:
  level:
    com.xilespa: DEBUG

# Mặc định tài khoản chủ tiệm trên máy dev (card S1-02)
xile:
  init:
    owner:
      email: ${APP_OWNER_EMAIL:owner@xilespa.vn}
      password: ${APP_OWNER_PASSWORD:xile_dev_123}
      display-name: ${APP_OWNER_NAME:Chủ tiệm Xile}

