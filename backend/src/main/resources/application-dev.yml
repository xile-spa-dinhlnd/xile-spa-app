# Máy dev: Postgres chạy bằng docker-compose.yml ở thư mục gốc, cổng 5433 (card S0-05). Giá trị mặc định chỉ dùng cho DB dev, ghi đè bằng biến môi trường.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/xile_spa}
    username: ${DB_USERNAME:xile}
    password: ${DB_PASSWORD:xile_dev}

logging:
  level:
    com.xilespa: DEBUG

xile:
  init:
    owner:
      email: ${APP_OWNER_EMAIL:owner@xilespa.vn}
      password: ${APP_OWNER_PASSWORD:xile_dev_123}
      display-name: ${APP_OWNER_NAME:Chủ tiệm Xile}
  dev-data:
    enabled: ${XILE_DEV_DATA:true} # tắt bằng XILE_DEV_DATA=false nếu muốn database dev trống
  mail:
    sender: log
  security:
    jwt:
      secret: ${JWT_SECRET:xile-spa-dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
      access-token-duration: 15m
      refresh-token-duration: 7d
      cookie-secure: false
    auth:
      reset-password-base-url: http://localhost:5173/reset-password


