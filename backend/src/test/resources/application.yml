spring:
  jpa:
    open-in-view: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

xile:
  dev-data:
    enabled: false
  init:
    owner:
      enabled: false
  mail:
    sender: log
  security:
    jwt:
      secret: test-secret-key-at-least-256-bits-long-for-hmac-sha256-algorithm-test
      access-token-duration: 15m
      refresh-token-duration: 7d
      cookie-secure: false
    auth:
      max-failed-attempts: 5
      lock-duration: 15m
      password-reset-duration: 30m
      reset-password-base-url: http://localhost:5173/reset-password
